server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      # 响应头强制携带 charset，避免部分客户端（如 PowerShell）按 Latin-1 解码中文乱码
      force-response: true

spring:
  application:
    name: nail-diy-shop
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/nail_diy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    # 本地部署请修改为自己的 MySQL 密码（或通过环境变量注入）
    password: ${MYSQL_PASSWORD:1234}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 业务自定义配置
nail:
  upload:
    # 素材/封面/晒图等文件保存目录（相对运行目录，也可写绝对路径）
    dir: uploads/
  freight:
    # 邮寄固定运费（元）
    amount: 8
    # 满额包邮门槛（商品合计 ≥ 该值免运费）
    free-over: 99
  jwt:
    # JWT 签名密钥（HS256，生产环境请更换并妥善保管）
    secret: nail-diy-shop-jwt-secret-key-2026
    # token 有效期（毫秒），默认 7 天
    expire: 604800000

logging:
  level:
    com.diy.nail: debug
