server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      # 响应头强制携带 charset，避免部分客户端（如 PowerShell）按 Latin-1 解码中文乱码
      force-response: true

spring:
  application:
    name: nail-diy-shop
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/nail_diy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    # 必须通过环境变量注入，避免弱默认密码进入运行环境
    password: ${MYSQL_PASSWORD}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 业务自定义配置
nail:
  upload:
    # 素材/封面/晒图等文件保存目录（相对运行目录，也可写绝对路径）
    dir: uploads/
    # 待审核 UGC 保存目录，不映射为静态资源
    private-dir: private-uploads/
  freight:
    # 邮寄固定运费（元）
    amount: 8
    # 满额包邮门槛（商品合计 ≥ 该值免运费）
    free-over: 99
  jwt:
    # JWT 签名密钥（HS256），必须通过环境变量注入且不少于 32 位
    secret: ${JWT_SECRET}
    # token 有效期（毫秒），默认 7 天
    expire: 604800000

logging:
  level:
    com.diy.nail: ${APP_LOG_LEVEL:info}
